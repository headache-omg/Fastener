[package]
name = "fastener"
version = "1.2.3"
edition = "2024"
description = "Parallel Fastener archiver with automatic hybrid CPU/GPU boundary analysis"
license = "MIT"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
getrandom = "0.4"
rpassword = "7.4"
zeroize = "1.8"
blake3 = { version = "1.8", features = ["rayon"] }
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
reed-solomon-erasure = "6.0.0"
zstd = "0.13"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std"] }
memmap2 = "0.9.11"
tempfile = "3.23"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
wgpu = { version = "30.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.24", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "fastener-gui"
path = "src/gui.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
